<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofonias Aberra — AWS Cloud Engineer</title>
<meta name="description" content="Portfolio of Sofonias Aberra, AWS Cloud Engineer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TOKENS
   ========================================================== */
:root {
  --bg: #161618;
  --bg-rgb: 22, 22, 24;
  --surface: #1E1E21;
  --surface-2: #202024;
  --border: #2A2A2E;
  --text: #F2F2F0;
  --text-muted: #9A9A9E;
  --accent: #2FE6A0;
  --accent-dim: rgba(47, 230, 160, 0.12);
  --accent-2: #F05A5A;
  --accent-2-dim: rgba(240, 90, 90, 0.14);

  --font-display: 'Sora', sans-serif;
  --font-body: 'Inter', sans-serif;

  --max-width: 1180px;
  --radius: 12px;
  --radius-sm: 8px;
  --nav-height: 76px;
}

:root[data-theme="light"] {
  --bg: #F6F7F5;
  --bg-rgb: 246, 247, 245;
  --surface: #FFFFFF;
  --surface-2: #EFF1EE;
  --border: #DDE0DC;
  --text: #16181A;
  --text-muted: #5B5F5C;
  --accent: #0FA26F;
  --accent-dim: rgba(15, 162, 111, 0.10);
  --accent-2: #D14848;
  --accent-2-dim: rgba(209, 72, 72, 0.10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); overflow-x: hidden; overscroll-behavior-x: none; }

body {
  overflow-x: hidden;
  overscroll-behavior-x: none;
  max-width: 100vw;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
ul { margin: 0; padding: 0; list-style: none; }

.section__inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 32px;
}

.accent { color: var(--accent); }

.eyebrow {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}

.section__heading {
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 700;
  margin-bottom: 28px;
  max-width: 640px;
}

/* ==========================================================
   "COMING SOON" BADGE
   Add "comingSoon": true to a section's data (Projects,
   Certifications) to hide its grid and show this stamp instead.
   ========================================================== */
.section-head {
  position: relative;
  display: inline-block;
  max-width: 100%;
}
.coming-soon-badge {
  display: none;
  align-items: center;
  position: absolute;
  top: -14px;
  right: -14px;
  background: var(--accent-2);
  color: #fff;
  font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
  padding: 6px 14px;
  border-radius: 6px;
  transform: rotate(7deg);
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  white-space: nowrap;
  z-index: 2;
}
.coming-soon-badge__prompt { opacity: 0.8; margin-right: 6px; }
.coming-soon-badge__cursor {
  display: inline-block;
  width: 6px;
  height: 1em;
  margin-left: 2px;
  background: #fff;
  vertical-align: middle;
  animation: blinkCursor 1s step-end infinite;
}
.is-coming-soon .coming-soon-badge { display: inline-flex; }
.is-coming-soon .project-grid,
.is-coming-soon .cert-grid { display: none; }

@media (max-width: 480px) {
  .coming-soon-badge { top: -10px; right: -6px; font-size: 11px; padding: 5px 12px; }
}

.subheading {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-muted);
  margin: 32px 0 16px;
}

/* Reveal-on-scroll */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.is-visible { opacity: 1; transform: translateY(0); }

/* ==========================================================
   BUTTONS
   ========================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px 26px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  border: 1px solid transparent;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
}
.btn:hover { transform: translateY(-2px); }
.btn__icon { width: 16px; height: 16px; flex-shrink: 0; transition: transform 0.2s ease; }
.btn--accent:hover .btn__icon { transform: translateX(3px); }
.btn--outline:hover .btn__icon { transform: translateY(2px); }

.btn--accent { background: var(--accent); color: #0B1410; }
.btn--accent:hover { background: #26cf8f; }

.btn--outline { border-color: var(--border); color: var(--text); }
.btn--outline:hover { border-color: var(--accent); color: var(--accent); }

/* ==========================================================
   THEME TOGGLE
   ========================================================== */
.theme-toggle {
  position: relative;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
}
.theme-toggle:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }

.theme-toggle__icon {
  width: 17px;
  height: 17px;
  position: absolute;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.theme-toggle__icon--sun { opacity: 0; transform: scale(0.6) rotate(-45deg); }
.theme-toggle__icon--moon { opacity: 1; transform: scale(1) rotate(0deg); }

:root[data-theme="light"] .theme-toggle__icon--sun { opacity: 1; transform: scale(1) rotate(0deg); }
:root[data-theme="light"] .theme-toggle__icon--moon { opacity: 0; transform: scale(0.6) rotate(45deg); }

/* ==========================================================
   NAV
   ========================================================== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--nav-height);
  display: flex;
  align-items: center;
  z-index: 100;
  background: transparent;
  border-bottom: none;
  color: var(--text);
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
/* Transparent state (top of page, over the hero photo): force light
   text/accent regardless of site theme — same reasoning as the hero
   itself, since the backdrop here is always the dark photo. */
.nav:not(.nav--scrolled) {
  --text: #F2F2F0;
  --text-muted: #E4E5E2;
  --accent: #2FE6A0;
  --border: rgba(255, 255, 255, 0.35);
  --surface: rgba(20, 20, 24, 0.55);
}
.nav--scrolled {
  background: rgba(var(--bg-rgb), 0.75);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.nav__inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 32px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav__logo {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.02em;
}
.nav__logo .dot { color: var(--accent); }

.nav__right { display: flex; align-items: center; gap: 24px; }
.nav__links { display: flex; gap: 32px; position: relative; }
.nav__link {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  padding: 8px 0;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.nav__link:hover { color: var(--text); }
.nav__link.active { color: var(--accent); }

.nav__indicator {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  transition: transform 0.3s ease, width 0.3s ease;
  pointer-events: none;
}

.nav__toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 32px;
  height: 32px;
  background: none;
  border: none;
  cursor: pointer;
}
.nav__toggle span {
  display: block;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

/* ==========================================================
   HERO
   ========================================================== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding-top: var(--nav-height);
  overflow: hidden;
  color: var(--text);

  /* The hero photo stays consistently darkened with light text
     regardless of the site's dark/light toggle — a light overlay
     is too dependent on the specific photo's content to be reliable,
     a dark one reads consistently no matter the theme or image. */
  --text: #F2F2F0;
  --text-muted: #C9CAC7;
  --border: rgba(255, 255, 255, 0.35);
  --accent: #2FE6A0;
  --accent-dim: rgba(47, 230, 160, 0.16);
  --hero-overlay-rgb: 10, 10, 13;
  --hero-overlay-v1: 0.30;
  --hero-overlay-v2: 0.60;
  --hero-overlay-h1: 0.50;
  --hero-overlay-h2: 0.15;
}
.hero__bg { position: absolute; inset: 0; z-index: 0; opacity: 0.55; }
.hero__bg svg { width: 100%; height: 100%; }
.net-lines line { stroke: var(--border); stroke-width: 1; }
.net-icons .float-icon {
  color: var(--accent);
  opacity: 0.4;
  animation: floatIcon 6s ease-in-out infinite;
}
@keyframes floatIcon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}
@media (prefers-reduced-motion: reduce) {
  .net-icons .float-icon { animation: none; }
}

.hero__photo-bg { position: absolute; inset: 0; z-index: 0; }
.hero__photo-bg img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
.hero__overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(var(--hero-overlay-rgb),var(--hero-overlay-v1)) 0%, rgba(var(--hero-overlay-rgb),var(--hero-overlay-v2)) 75%, rgb(var(--hero-overlay-rgb)) 100%),
    linear-gradient(90deg, rgba(var(--hero-overlay-rgb),var(--hero-overlay-h1)) 0%, rgba(var(--hero-overlay-rgb),var(--hero-overlay-h2)) 55%, rgba(var(--hero-overlay-rgb),var(--hero-overlay-h1)) 100%);
  transition: background 0.3s ease;
}

.hero__content {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 760px;
  margin: 0 auto;
}
.hero__cta { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.hero__heading {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 10px 0 28px;
}
.hero__role-wrap {
  display: inline-flex;
  align-items: center;
  color: var(--accent);
  font-weight: 600;
  font-size: clamp(15px, 4.2vw, 22px);
  max-width: 100%;
}
.hero__role { white-space: nowrap; overflow: hidden; }
.hero__cursor {
  display: inline-block;
  width: 2px;
  height: 0.9em;
  margin-left: 4px;
  background: var(--accent);
  animation: blinkCursor 1s step-end infinite;
}
@keyframes blinkCursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hero__cursor { animation: none; }
}

/* ==========================================================
   SECTIONS (generic)
   ========================================================== */
.section { padding: 110px 0; }
.section--alt { background: var(--surface-2); }

/* ABOUT */
.about__text { max-width: 720px; }
.about__text p { color: var(--text-muted); margin-bottom: 16px; font-size: 16px; }

/* SKILLS */
.skills { position: relative; overflow: hidden; }
.skills__bg { position: absolute; inset: 0; z-index: 0; opacity: 0.5; pointer-events: none; }
.skills__bg svg { width: 100%; height: 100%; }
.skills__content { position: relative; z-index: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, background 0.2s ease;
}
.chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); background: var(--accent-dim); }
.marquee--aws .chip { font-family: var(--font-display); font-weight: 600; }

.chip__icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: var(--accent);
}

/* ==========================================================
   MARQUEE (auto-scrolling + draggable strip, used for Skills + Clients)
   Motion is driven by JS (script.js) so auto-scroll, pause, and
   manual drag/swipe can all share the same position seamlessly.
   ========================================================== */
.marquee {
  position: relative;
  max-width: 100%;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  cursor: grab;
  -webkit-mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
  mask-image: linear-gradient(90deg, transparent, black 6%, black 94%, transparent);
}
.marquee.is-dragging { cursor: grabbing; }
.marquee__track {
  display: flex;
  width: max-content;
  will-change: transform;
}
.marquee__group {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  padding-right: 12px;
}
.marquee--static {
  overflow-x: auto;
  cursor: auto;
  -webkit-mask-image: none;
  mask-image: none;
}

.marquee--clients { margin-top: 40px; }
.client-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 0 40px;
}
.client-card__logo {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--accent);
  overflow: hidden;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.client-card__logo--image {
  background: #FFFFFF;
  padding: 11px;
}
.client-card__logo--image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.client-card:hover .client-card__logo { border-color: var(--accent); transform: translateY(-3px); }
.client-card__name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}

/* EXPERIENCE / TIMELINE */
.timeline {
  position: relative;
  padding-left: 32px;
  border-left: 1px solid var(--border);
}
.timeline__item {
  position: relative;
  padding-bottom: 48px;
}
.timeline__item:last-child { padding-bottom: 0; }
.timeline__item::before {
  content: "";
  position: absolute;
  left: -37px;
  top: 6px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-dim);
}
.timeline__dates {
  display: inline-block;
  background: var(--accent-dim);
  color: var(--accent);
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.timeline__role {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 2px;
}
.timeline__company {
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 12px;
  display: block;
}
.timeline__points { color: var(--text-muted); font-size: 15px; }
.timeline__points li { margin-bottom: 6px; padding-left: 18px; position: relative; }
.timeline__points li::before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--border);
}

/* PROJECTS */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}
.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.project-card:hover { transform: translateY(-4px); border-color: var(--accent); }
.project-card__visual {
  height: 140px;
  border-radius: var(--radius-sm);
  background:
    radial-gradient(circle at 20% 30%, var(--accent-dim), transparent 40%),
    radial-gradient(circle at 80% 70%, var(--accent-2-dim), transparent 40%),
    var(--surface-2);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.project-card__visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
  opacity: 0.4;
}
.project-card__title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}
.project-card__desc {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 18px;
}
.project-card__tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.tag {
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-display);
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--accent-dim);
  color: var(--accent);
}
.project-card__link {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.project-card__link:hover { text-decoration: underline; }

/* CERTIFICATIONS */
.cert-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
}
.cert-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  display: flex;
  gap: 18px;
  align-items: flex-start;
}
.cert-card__badge {
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent-dim);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 14px;
}
.cert-card__name { font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.cert-card__meta { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
.cert-card__link { font-size: 13px; font-weight: 600; color: var(--accent); }
.cert-card__link:hover { text-decoration: underline; }

.cert-card--placeholder {
  border-style: dashed;
  color: var(--text-muted);
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 14px;
}

/* CONTACT */
.contact { text-align: center; max-width: 640px; }
.contact__subtitle { color: var(--text-muted); margin: 18px 0 32px; }
.contact__links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.contact__links .btn { min-width: 150px; }

/* FOOTER */
.footer { border-top: 1px solid var(--border); padding: 32px 0; }
.footer__inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  color: var(--text-muted);
  font-size: 14px;
}
.footer__socials { display: flex; gap: 20px; }
.footer__socials a:hover { color: var(--accent); }

/* ==========================================================
   RESPONSIVE
   ========================================================== */
@media (max-width: 860px) {
  .hero__heading { font-size: clamp(32px, 8vw, 48px); }
}

@media (max-width: 720px) {
  .nav__links {
    position: fixed;
    top: var(--nav-height);
    left: 0; right: 0;
    background: transparent;
    border-bottom: 1px solid transparent;
    flex-direction: column;
    gap: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
  }
  .nav__links.open { max-height: 400px; border-bottom-color: var(--border); background: var(--bg); }
  .nav__link { padding: 16px 32px; width: 100%; border-bottom: 1px solid var(--border); border-left: 2px solid transparent; }
  .nav__link.active { border-left-color: var(--accent); border-bottom-color: var(--border); }
  .nav__indicator { display: none; }
  .nav__toggle { display: flex; }

  .section { padding: 72px 0; }
}

@media (max-width: 480px) {
  .section__inner { padding: 0 20px; }
  .hero__cta { flex-direction: column; align-items: flex-start; }
  .hero__cta .btn { width: 100%; justify-content: center; }
}

</style>
<script>
  // Runs before paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
    } catch (e) {

    $('[data-hero-accent]').textContent = data.hero.headingAccent;
    $('[data-hero-post]').textContent = data.hero.headingPost;

    $('[data-hero-photo]').src = data.meta.photoUrl;
    $('[data-hero-photo]').style.objectPosition = data.meta.photoPosition || 'center 22%';
    $('[data-hero-resume]').href = data.meta.resumeUrl;

    startRoleTypewriter($('[data-hero-role]'), data.hero.roles);

    /* ----- ABOUT ----- */
    $('[data-about-eyebrow]').textContent = data.about.eyebrow;
    $('[data-about-heading]').textContent = data.about.heading;
    const aboutP = $('[data-about-paragraphs]');
    data.about.paragraphs.forEach(p => {
      const el = document.createElement('p');
      el.textContent = p;
      aboutP.appendChild(el);
    });

    /* ----- SKILLS (auto-scrolling marquees) ----- */
    $('[data-skills-eyebrow]').textContent = data.skills.eyebrow;
    $('[data-skills-heading]').textContent = data.skills.heading;

    const buildChip = (item) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `
        <svg class="chip__icon" viewBox="0 0 24 24"><use href="#icon-${item.icon}"></use></svg>
        <span>${item.name}</span>
      `;
      return chip;
    };
    buildMarquee($('[data-skills-aws]'), data.skills.aws, buildChip);
    buildMarquee($('[data-skills-tools]'), data.skills.tools, buildChip);

    /* ----- EXPERIENCE ----- */
    $('[data-exp-eyebrow]').textContent = data.experience.eyebrow;
    $('[data-exp-heading]').textContent = data.experience.heading;
    const expEl = $('[data-exp-items]');
    data.experience.items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'timeline__item reveal';
      div.style.transitionDelay = `${i * 80}ms`;
      div.innerHTML = `
        <span class="timeline__dates">${item.dates}</span>
        <div class="timeline__role">${item.role}</div>
        <span class="timeline__company">${item.company}</span>
        <ul class="timeline__points">
          ${item.points.map(p => `<li>${p}</li>`).join('')}
        </ul>
      `;
      expEl.appendChild(div);
    });

    /* ----- PROJECTS ----- */
    $('[data-proj-eyebrow]').textContent = data.projects.eyebrow;
    $('[data-proj-heading]').textContent = data.projects.heading;
    $('#projects').classList.toggle('is-coming-soon', !!data.projects.comingSoon);
    if (data.projects.comingSoon) {
      watchTerminalBadge($('#projects'));
    }
    const projEl = $('[data-proj-items]');
    data.projects.items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'project-card reveal';
      div.style.transitionDelay = `${i * 80}ms`;
      div.innerHTML = `
        <div class="project-card__visual" aria-hidden="true"></div>
        <div class="project-card__title">${item.title}</div>
        <p class="project-card__desc">${item.description}</p>
        <div class="project-card__tags">
          ${item.tech.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <a class="project-card__link" href="${item.link}" target="_blank" rel="noopener">View on GitHub &rarr;</a>
      `;
      projEl.appendChild(div);
    });

    /* ----- CLIENTS (auto-scrolling marquee) ----- */
    $('[data-clients-eyebrow]').textContent = data.clients.eyebrow;
    $('[data-clients-heading]').textContent = data.clients.heading;
    const buildClientCard = (item) => {
      const card = document.createElement('div');
      card.className = 'client-card';

      const logo = document.createElement('div');
      logo.className = 'client-card__logo';

      if (item.logoUrl) {
        logo.classList.add('client-card__logo--image');
        const img = document.createElement('img');
        img.src = item.logoUrl;
        img.alt = `${item.name} logo`;
        img.loading = 'lazy';
        img.onerror = () => {
          // Broken/missing logo URL — fall back to initials instead of a broken image icon.
          logo.classList.remove('client-card__logo--image');
          logo.textContent = item.initials;
        };
        logo.appendChild(img);
      } else {
        logo.textContent = item.initials;
      }

      const name = document.createElement('div');
      name.className = 'client-card__name';
      name.textContent = item.name;

      card.appendChild(logo);
      card.appendChild(name);
      return card;
    };
    buildMarquee($('[data-clients-items]'), data.clients.items, buildClientCard);

    /* ----- CERTIFICATIONS ----- */
    $('[data-cert-eyebrow]').textContent = data.certifications.eyebrow;
    $('[data-cert-heading]').textContent = data.certifications.heading;
    $('#certifications').classList.toggle('is-coming-soon', !!data.certifications.comingSoon);
    if (data.certifications.comingSoon) {
      watchTerminalBadge($('#certifications'));
    }
    const certEl = $('[data-cert-items]');
    data.certifications.items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'cert-card reveal';
      div.style.transitionDelay = `${i * 80}ms`;
      div.innerHTML = `
        <div class="cert-card__badge">AWS</div>
        <div>
          <div class="cert-card__name">${item.name}</div>
          <div class="cert-card__meta">${item.issuer} &middot; ${item.date}</div>
          <a class="cert-card__link" href="${item.link}" target="_blank" rel="noopener">Verify credential &rarr;</a>
        </div>
      `;
      certEl.appendChild(div);
    });
    const placeholderCert = document.createElement('div');
    placeholderCert.className = 'cert-card cert-card--placeholder reveal';
    placeholderCert.textContent = 'More certifications in progress';
    certEl.appendChild(placeholderCert);

    /* ----- CONTACT ----- */
    $('[data-contact-eyebrow]').textContent = data.contact.eyebrow;
    $('[data-contact-heading]').textContent = data.contact.heading;
    $('[data-contact-subtitle]').textContent = data.contact.subtitle;
    $('[data-contact-links]').innerHTML = `
      <a class="btn btn--accent" href="${data.meta.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn btn--outline" href="${data.meta.github}" target="_blank" rel="noopener">GitHub</a>
      <a class="btn btn--outline" href="mailto:${data.meta.email}">Email Me</a>
    `;

    /* ----- FOOTER ----- */
    $('#year').textContent = new Date().getFullYear();
    $('[data-footer-links]').innerHTML = `
      <a href="${data.meta.linkedin}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="${data.meta.github}" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:${data.meta.email}">Email</a>
    `;

    /* Reveal observer must attach AFTER dynamic content exists */
    initRevealObserver();
  }

  /* ==========================================================
     MARQUEE BUILDER
     Renders items into a track. Motion (auto-scroll, pause on
     hover/touch, and free drag/swipe repositioning) is handled
     by initMarqueeMotion below — all driven by one shared
     "offset" value so dragging and auto-scroll never fight or
     jump. Respects prefers-reduced-motion by falling back to a
     plain native-scrollable strip with no duplicate content.
     ========================================================== */
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildMarquee(marqueeEl, items, buildItem) {
    if (!marqueeEl || !items || !items.length) return;
    const track = marqueeEl.querySelector('[data-marquee-track]');
    if (!track) return;

    const group = document.createElement('div');
    group.className = 'marquee__group';
    items.forEach(item => group.appendChild(buildItem(item)));
    track.appendChild(group);

    if (prefersReducedMotion) {
      marqueeEl.classList.add('marquee--static');
      return;
    }

    track.appendChild(group.cloneNode(true));
    initMarqueeMotion(marqueeEl, track);
  }

  function initMarqueeMotion(marqueeEl, track) {
    const direction = marqueeEl.classList.contains('marquee--reverse') ? -1 : 1;
    const speed = parseFloat(marqueeEl.dataset.speed) || 30; // px per second

    let groupWidth = track.children[0].getBoundingClientRect().width;
    let offset = 0;
    let dragging = false;
    let interacting = false;
    let startX = 0;
    let startOffset = 0;
    let lastTimestamp = null;

    const wrap = (value, max) => ((value % max) + max) % max;

    function applyTransform() {
      track.style.transform = `translateX(${-wrap(offset, groupWidth)}px)`;
    }

    function onPointerDown(e) {
      dragging = true;
      interacting = true;
      startX = e.clientX;
      startOffset = offset;
      marqueeEl.classList.add('is-dragging');
      marqueeEl.setPointerCapture(e.pointerId);
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const deltaX = e.clientX - startX;
      offset = startOffset - deltaX;
      applyTransform();
    }
    function endInteraction() {
      dragging = false;
      interacting = false;
      marqueeEl.classList.remove('is-dragging');
    }

    marqueeEl.addEventListener('pointerdown', onPointerDown);
    marqueeEl.addEventListener('pointermove', onPointerMove);
    marqueeEl.addEventListener('pointerup', endInteraction);
    marqueeEl.addEventListener('pointercancel', endInteraction);
    marqueeEl.addEventListener('pointerenter', () => { interacting = true; });
    marqueeEl.addEventListener('pointerleave', () => { if (!dragging) interacting = false; });

    window.addEventListener('resize', () => {
      groupWidth = track.children[0].getBoundingClientRect().width;
    });

    function frame(timestamp) {
      if (lastTimestamp === null) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      if (!interacting) {
        offset += direction * speed * dt;
      }
      applyTransform();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ==========================================================
     TERMINAL TYPING (one-shot, for "Coming Soon" badges)
     Types the text once and stops — unlike the hero role
     typewriter, this doesn't loop or delete, just idles with
     a blinking cursor after, like a finished terminal command.
     Triggered on scroll-into-view (not on page load) so the
     animation is actually visible when the visitor arrives.
     ========================================================== */
  function startTerminalTyping(el, text = 'Coming Soon...') {
    if (!el) return;
    if (prefersReducedMotion) {
      el.textContent = text;
      return;
    }
    let i = 0;
    function tick() {
      i++;
      el.textContent = text.slice(0, i);
      if (i < text.length) setTimeout(tick, 85);
    }
    tick();
  }

  function watchTerminalBadge(sectionEl) {
    const typedEl = sectionEl && sectionEl.querySelector('.coming-soon-badge__typed');
    if (!typedEl) return;
    if (prefersReducedMotion) {
      typedEl.textContent = 'Coming Soon...';
      return;
    }
    const badgeObserver = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            startTerminalTyping(typedEl);
            badgeObserver.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.3 }
    );
    badgeObserver.observe(sectionEl);
  }

  /* ==========================================================
     HERO ROLE TYPEWRITER
     Cycles through data.hero.roles, typing/deleting each one.
     Respects prefers-reduced-motion by just showing the first role.
     ========================================================== */
  function startRoleTypewriter(el, roles) {
    if (!el || !roles || !roles.length) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      el.textContent = roles[0];
      return;
    }

    const TYPING_SPEED = 65;
    const DELETING_SPEED = 35;
    const PAUSE_AFTER_TYPE = 1500;
    const PAUSE_AFTER_DELETE = 300;

    let roleIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function tick() {
      const current = roles[roleIndex];

      if (!deleting) {
        charIndex++;
        el.textContent = current.slice(0, charIndex);
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(tick, PAUSE_AFTER_TYPE);
          return;
        }
        setTimeout(tick, TYPING_SPEED);
      } else {
        charIndex--;
        el.textContent = current.slice(0, charIndex);
        if (charIndex === 0) {
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
          setTimeout(tick, PAUSE_AFTER_DELETE);
          return;
        }
        setTimeout(tick, DELETING_SPEED);
      }
    }
    tick();
  }

  /* ==========================================================
     THEME TOGGLE
     Theme is already set on <html> by the inline head script
     (based on OS preference) before this file even runs, to
     avoid a flash of the wrong theme. This just wires up the
     manual override button. Kept in-memory only for now — see
     chat notes on why localStorage isn't used here.
     ========================================================== */
  const themeToggle = $('#themeToggle');
  const root = document.documentElement;
  const syncThemeButton = () => {
    themeToggle.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'light');
  };
  syncThemeButton();
  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    syncThemeButton();
  });

  /* ==========================================================
     NAV: sliding underline indicator (desktop only — mobile
     dropdown uses its own left-border active style instead)
     ========================================================== */
  const navLinksContainer = $('#navLinks');
  const navIndicator = document.createElement('span');
  navIndicator.className = 'nav__indicator';
  navIndicator.setAttribute('aria-hidden', 'true');
  navLinksContainer.appendChild(navIndicator);

  function moveNavIndicator(linkEl) {
    if (!linkEl) return;
    navIndicator.style.width = linkEl.offsetWidth + 'px';
    navIndicator.style.transform = `translateX(${linkEl.offsetLeft}px)`;
  }
  function currentActiveNavLink() {
    return navLinksContainer.querySelector('.nav__link.active');
  }
  moveNavIndicator(currentActiveNavLink());
  window.addEventListener('load', () => moveNavIndicator(currentActiveNavLink()));
  window.addEventListener('resize', () => moveNavIndicator(currentActiveNavLink()));

  /* ==========================================================
     NAV: transparent-over-hero, solid once scrolled past it
     ========================================================== */
  const navEl = $('#nav');
  const SCROLL_THRESHOLD = 60;
  let navScrollTicking = false;
  function updateNavScrollState() {
    navEl.classList.toggle('nav--scrolled', window.scrollY > SCROLL_THRESHOLD);
    navScrollTicking = false;
  }
  window.addEventListener('scroll', () => {
    if (!navScrollTicking) {
      requestAnimationFrame(updateNavScrollState);
      navScrollTicking = true;
    }
  }, { passive: true });
  updateNavScrollState(); // handle page loads that start mid-scroll (e.g. via anchor link)

  /* ==========================================================
     NAV: mobile toggle (static markup, safe to run immediately)
     ========================================================== */
  const navToggle = $('#navToggle');
  const navLinks = $('#navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', isOpen);
  });
  $$('.nav__link').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
      moveNavIndicator(link);
    });
  });

  /* ==========================================================
     NAV: scroll-spy (sections exist in static markup)
     ========================================================== */
  const sections = $$('main section[id]');
  const navLinkEls = $$('.nav__link');
  const spyObserver = new IntersectionObserver(
    entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          navLinkEls.forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
          });
          moveNavIndicator(currentActiveNavLink());
        }
      });
    },
    { rootMargin: '-45% 0px -50% 0px', threshold: 0 }
  );
  sections.forEach(s => spyObserver.observe(s));

  /* ==========================================================
     REVEAL ON SCROLL
     Called after render() since most .reveal elements are
     created dynamically from fetched/fallback content.
     ========================================================== */
  function initRevealObserver() {
    const revealObserver = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15 }
    );
    $$('.reveal').forEach(el => revealObserver.observe(el));
  }

})();

</script>
</body>
</html>
