<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 6rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="emoji">🚧</div>

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you're looking for doesn't exist,
        may have been moved, or the URL is incorrect.
    </p>

    <a href="/">← Back to Portfolio</a>

</div>

</body>
</html>
